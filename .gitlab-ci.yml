workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

stages:
  - verify

default:
  image: golang:1.26.6
  interruptible: true

variables:
  CGO_ENABLED: "0"
  GOFLAGS: "-mod=vendor"
  GOTOOLCHAIN: local
  GIT_DEPTH: "0"
  GIT_STRATEGY: clone

verify:
  stage: verify
  tags:
    - docker-only
    - proxy
    - reregister
    - ukd
  cache:
    key: go-1.26.6-linux-amd64
    paths:
      - .cache/teamkit-go/
  script:
    - . scripts/ensure-go.sh
    - go version
    - go vet ./...
    - go test ./...
    - bash scripts/build.sh v0.1.5
    - go run ./cmd/teamkit-security-audit --repository . --path dist --commit "$CI_COMMIT_SHA" --history-ref "$CI_COMMIT_SHA" --output dist/SECURITY-AUDIT.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/

release-handoff:
  stage: verify
  image: golang:1.26.6
  needs: []
  rules:
    - if: '$GITHUB_RUN_ID && $GITHUB_ARTIFACT_ID && $GITHUB_ARTIFACT_DIGEST && $GITHUB_HANDOFF_TOKEN'
    - when: never
  tags:
    - docker-only
    - proxy
    - reregister
    - ukd
  script:
    - go run ./scripts/release/handoff
  artifacts:
    when: on_success
    expire_in: never
    paths:
      - handoff/
