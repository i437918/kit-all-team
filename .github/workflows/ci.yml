name: ci

on:
  pull_request:
  push:
    branches: [master, main, "feat/**"]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA checked out and qualified by this run
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: v0.1.5

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate-digest: ${{ format('sha256:{0}', steps.upload-candidate.outputs.artifact-digest) }}
    steps:
      - name: Bind trusted dispatch to exact commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Build exact candidate set
        shell: bash
        run: bash scripts/build.sh "$VERSION"
      - name: Build release security auditor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-tool
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -buildvcs=false -trimpath \
            -o security-tool/security-auditor-linux-amd64 \
            ./cmd/teamkit-security-audit
          (cd security-tool && sha256sum security-auditor-linux-amd64 > SHA256SUMS)
      - name: Audit repository, history, and exact candidate set
        shell: bash
        run: |
          set -euo pipefail
          security-tool/security-auditor-linux-amd64 \
            --repository . --path dist --commit "$GITHUB_SHA" \
            --history-ref "$GITHUB_SHA" \
            --output dist/SECURITY-AUDIT.json
      - name: Upload release security auditor
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-auditor-tool
          path: security-tool/
          if-no-files-found: error
          retention-days: 14
      - id: upload-candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: candidate-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 14

  native:
    needs: build-candidate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            binary: teamkit-v0.1.5-windows-amd64.exe
            officecli_asset: officecli-win-x64.exe
          - runner: ubuntu-24.04
            binary: teamkit-v0.1.5-linux-amd64
            officecli_asset: officecli-linux-x64
          - runner: macos-15-intel
            binary: teamkit-v0.1.5-darwin-amd64
            officecli_asset: officecli-mac-x64
          - runner: macos-15
            binary: teamkit-v0.1.5-darwin-arm64
            officecli_asset: officecli-mac-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-binaries
          path: dist
      - name: Verify source and exact platform binary
        shell: bash
        env:
          TEAMKIT_TEST_BINARY: dist/${{ matrix.binary }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build-candidate.outputs.candidate-digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/evidence/native
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum --check --strict SHA256SUMS)
          else
            (cd dist && shasum -a 256 --check SHA256SUMS)
          fi
          chmod +x "$TEAMKIT_TEST_BINARY"
          go vet ./...
          go test -json ./... | tee "dist/evidence/native/${{ matrix.runner }}-tests.json"
          go test -race ./...
          "$TEAMKIT_TEST_BINARY" --version | tee "dist/evidence/native/${{ matrix.runner }}-version.json"
          printf 'candidate_digest=%s\n' "$CANDIDATE_ARTIFACT_DIGEST" > "dist/evidence/native/${{ matrix.runner }}-candidate.txt"
          go run ./cmd/teamkit-security-audit \
            --repository . --path dist --commit "$GITHUB_SHA" \
            --history-ref "$GITHUB_SHA" \
            --output "dist/evidence/native/security-audit-${{ matrix.runner }}.json"
      - name: Verify qualified OfficeCLI runtime and MCP handshake
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TEAMKIT_OFFICECLI_KEEP_PATH: ${{ github.workspace }}/dist/evidence/officecli
          TEAMKIT_OFFICECLI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: go test -tags officecli_live ./internal/service -run TestOfficeCLILive_QualifiedAssetAndMCPHandshake -count=1 -timeout=3m
      - name: Verify OfficeCLI Developer ID signature and notarization policy
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.runner, 'macos-')
        shell: bash
        env:
          OFFICECLI_EVIDENCE: ${{ github.workspace }}/dist/evidence/officecli/${{ matrix.officecli_asset }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "$OFFICECLI_EVIDENCE"
          export LC_ALL=C
          spctl_output_file=$(mktemp)
          spctl_expected_file=$(mktemp)
          trap 'rm -f -- "$spctl_output_file" "$spctl_expected_file"' EXIT
          set +e
          spctl --assess --type execute --verbose=4 "$OFFICECLI_EVIDENCE" 2>&1 |
            head -c 4097 >"$spctl_output_file"
          spctl_status=${PIPESTATUS[0]}
          set -e
          spctl_output_size=$(wc -c <"$spctl_output_file" | tr -d '[:space:]')
          test "$spctl_output_size" -le 4096
          if [ "$spctl_status" -eq 0 ]; then
            printf 'OFFICECLI_SPCTL_ACCEPTED\n'
          else
            test "$spctl_status" -eq 3
            spctl_message='rejected (the code is valid but does not seem to be an app)'
            spctl_match=false
            for spctl_prefix in "" "$OFFICECLI_EVIDENCE: "; do
              printf '%s%s' "$spctl_prefix" "$spctl_message" >"$spctl_expected_file"
              cmp -s -- "$spctl_output_file" "$spctl_expected_file" && spctl_match=true
              printf '\n' >>"$spctl_expected_file"
              cmp -s -- "$spctl_output_file" "$spctl_expected_file" && spctl_match=true
            done
            test "$spctl_match" = true
            printf 'OFFICECLI_SPCTL_BARE_MACHO_NOT_APP\n'
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: native-evidence-${{ matrix.runner }}
          path: |
            dist/evidence/native/${{ matrix.runner }}-*
            dist/evidence/native/security-audit-${{ matrix.runner }}.json
            dist/evidence/officecli/
          if-no-files-found: error
          retention-days: 14

  alt-p11-userspace:
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-binaries
          path: dist
      - name: Run exact candidate in pinned ALT p11 userspace
        shell: bash
        env:
          ALT_IMAGE: registry.altlinux.org/p11/alt@sha256:4c76520bb4935edf624dde76d5e670d54f40938323b185c4c7270881b71fd8ea
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build-candidate.outputs.candidate-digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/evidence/alt-userspace
          (cd dist && sha256sum --check --strict SHA256SUMS)
          chmod 0755 dist/teamkit-v0.1.5-linux-amd64
          bash scripts/alt-container-smoke.sh dist/teamkit-v0.1.5-linux-amd64 | tee dist/evidence/alt-userspace/smoke.log
          printf 'candidate_digest=%s\n' "$CANDIDATE_ARTIFACT_DIGEST" > dist/evidence/alt-userspace/candidate.txt
          go run ./cmd/teamkit-security-audit \
            --repository . --path dist --commit "$GITHUB_SHA" \
            --history-ref "$GITHUB_SHA" \
            --output dist/evidence/alt-userspace/security-audit-alt-userspace.json
      - name: Authenticate private ALT qualification registry
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/alt-p11-officecli-read-docker-config-${{ github.run_id }}-${{ github.run_attempt }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_docker_config="${RUNNER_TEMP:?}/alt-p11-officecli-read-docker-config-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          test "$DOCKER_CONFIG" = "$expected_docker_config"
          test ! -e "$DOCKER_CONFIG"
          install -d -m 0700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Verify qualified OfficeCLI in pinned ALT p11 userspace
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/alt-p11-officecli-read-docker-config-${{ github.run_id }}-${{ github.run_attempt }}
          TEAMKIT_OFFICECLI_KEEP_PATH: ${{ github.workspace }}/dist/evidence/officecli
          ALT_IMAGE: ghcr.io/i437918/kit-all-team/alt-p11-officecli@sha256:5ee493c6c7edbdb8d68fb0ab9af2847bae855c9042bc5f13f5fd6b3d0965a825
          TEAMKIT_OFFICECLI_ALT_LIBRT_PACKAGE: glibc-pthread-6:2.38.0.223.f053ff-alt1.p11.1.x86_64
          TEAMKIT_OFFICECLI_ALT_LDD_PACKAGE: glibc-utils-6:2.38.0.223.f053ff-alt1.p11.1.x86_64
          TEAMKIT_OFFICECLI_ALT_ICU_PACKAGE: libicu74-1:7.4.2-alt1.x86_64
        run: |
          set -euo pipefail
          mkdir -p dist/evidence/officecli
          go test -tags officecli_live ./internal/service -run TestOfficeCLILive_QualifiedAssetAndMCPHandshake -count=1 -timeout=3m
          officecli_asset=dist/evidence/officecli/officecli-linux-x64
          chmod 0755 "$officecli_asset"
          test "$(wc -c < "$officecli_asset")" -eq 35316133
          printf '%s  %s\n' 32ef7a21a54a4ca6c9806bf5e9f3d32bfb1291017329c55044cb2aac71822eb8 "$officecli_asset" | sha256sum --check --strict
          CGO_ENABLED=0 go test -c -tags officecli_live -o dist/evidence/officecli/officecli-live.test ./internal/service
          chmod 0755 dist/evidence/officecli/officecli-live.test
          bash scripts/alt-container-smoke.sh \
            dist/teamkit-v0.1.5-linux-amd64 \
            "$officecli_asset" \
            dist/evidence/officecli/officecli-live.test \
            | tee -a dist/evidence/alt-userspace/smoke.log
      - name: Remove private ALT registry credentials
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/alt-p11-officecli-read-docker-config-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected_docker_config="${RUNNER_TEMP:?}/alt-p11-officecli-read-docker-config-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          test -n "$DOCKER_CONFIG"
          test "$DOCKER_CONFIG" = "$expected_docker_config"
          case "$DOCKER_CONFIG" in
            "$expected_docker_config") ;;
            *) printf 'DOCKER_CONFIG_UNEXPECTED\n' >&2; exit 64 ;;
          esac
          if [[ -e "$DOCKER_CONFIG" ]]; then
            docker logout ghcr.io >/dev/null 2>&1 || true
          fi
          rm -rf -- "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: alt-userspace-evidence
          path: dist/evidence/alt-userspace/
          if-no-files-found: error
          retention-days: 14
