name: hermes-windows-installer-contract-experimental

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful ci run containing the exact candidate-binaries artifact
        required: true
        type: string
      candidate_digest:
        description: Exact sha256 digest reported for candidate-binaries
        required: true
        type: string
      payload_release:
        description: Private release tag containing the exact Hermes-Setup.exe payload
        required: true
        type: string
      launch_visible_installer:
        description: Launch the GUI briefly; this does not verify installation or HERMES_HOME
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  VERSION: v0.1.5

jobs:
  disposable-contract:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Gate exact candidate on successful same-commit CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:CI_RUN_ID -notmatch '^[0-9]+$') { throw 'CI_RUN_ID_INVALID' }
          if ($env:CANDIDATE_ARTIFACT_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') { throw 'CANDIDATE_DIGEST_INVALID' }
          $runJSON = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CI_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'CI_RUN_LOOKUP_FAILED' }
          $run = ($runJSON | Out-String) | ConvertFrom-Json
          if ([string]$run.path -ne '.github/workflows/ci.yml') { throw 'CI_WORKFLOW_MISMATCH' }
          if ([string]$run.conclusion -ne 'success') { throw 'CI_RUN_NOT_SUCCESSFUL' }
          if ([string]$run.head_sha -ne $env:GITHUB_SHA) { throw 'CI_COMMIT_MISMATCH' }
          $artifactJSON = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CI_RUN_ID/artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'CI_ARTIFACT_LOOKUP_FAILED' }
          $document = ($artifactJSON | Out-String) | ConvertFrom-Json
          $candidate = @($document.artifacts | Where-Object { $_.name -eq 'candidate-binaries' -and -not $_.expired })
          if ($candidate.Count -ne 1) { throw 'CI_CANDIDATE_AMBIGUOUS' }
          if ([string]$candidate[0].digest -ne $env:CANDIDATE_ARTIFACT_DIGEST) { throw 'CI_CANDIDATE_DIGEST_MISMATCH' }
      - name: Download exact Team Kit CI candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-binaries
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact private installer payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_RELEASE: ${{ inputs.payload_release }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:PAYLOAD_RELEASE -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$') { throw 'PAYLOAD_RELEASE_INVALID' }
          New-Item -ItemType Directory -Path payload -Force | Out-Null
          & gh release download --repo $env:GITHUB_REPOSITORY $env:PAYLOAD_RELEASE --pattern Hermes-Setup.exe --dir payload
          if ($LASTEXITCODE -ne 0) { throw 'INSTALLER_DOWNLOAD_FAILED' }
          if (@(Get-ChildItem -LiteralPath payload -File -Filter Hermes-Setup.exe).Count -ne 1) { throw 'INSTALLER_PAYLOAD_AMBIGUOUS' }
      - name: Verify exact artifacts and static installer contract
        shell: pwsh
        env:
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path evidence -Force | Out-Null

          $teamkitName = "teamkit-$env:VERSION-windows-amd64.exe"
          $teamkit = [IO.Path]::GetFullPath((Join-Path dist $teamkitName))
          if (-not (Test-Path -LiteralPath $teamkit -PathType Leaf)) { throw 'TEAMKIT_CANDIDATE_MISSING' }
          $checksumLines = @(Get-Content -LiteralPath 'dist/SHA256SUMS')
          $candidateLines = @($checksumLines | Where-Object { $_.EndsWith("  $teamkitName", [StringComparison]::Ordinal) })
          if ($candidateLines.Count -ne 1) { throw 'TEAMKIT_CHECKSUM_ENTRY_INVALID' }
          $expectedTeamKitHash = ($candidateLines[0] -split '\s+', 2)[0]
          if ($expectedTeamKitHash -notmatch '^[0-9a-f]{64}$') { throw 'TEAMKIT_CHECKSUM_INVALID' }
          $actualTeamKitHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $teamkit).Hash.ToLowerInvariant()
          if ($actualTeamKitHash -ne $expectedTeamKitHash) { throw 'TEAMKIT_CHECKSUM_MISMATCH' }
          $securityAudit = Get-Content -LiteralPath 'dist/SECURITY-AUDIT.json' -Raw | ConvertFrom-Json
          if ($securityAudit.schema_version -ne 1 -or -not $securityAudit.passed -or
              [string]$securityAudit.commit -ne $env:GITHUB_SHA -or @($securityAudit.findings).Count -ne 0) {
            throw 'TEAMKIT_SECURITY_AUDIT_INVALID'
          }
          $teamkitVersion = & $teamkit --version 2>&1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($teamkitVersion | Out-String))) { throw 'TEAMKIT_CANDIDATE_NOT_RUNNABLE' }
          $teamkitVersion | Set-Content -LiteralPath 'evidence/teamkit-version.json'

          $installer = (Resolve-Path 'payload/Hermes-Setup.exe').Path
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($hash -ne '505dfb4c2c1052b055e3fc694a76cb7ce093a64962c7713aa294f5549c6734f5') { throw 'INSTALLER_HASH_MISMATCH' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Nous Research Inc.*') { throw 'INSTALLER_SIGNATURE_MISMATCH' }

          $result = [ordered]@{
            schema_version = 1
            contract = 'static_only'
            source_commit = $env:GITHUB_SHA
            candidate_digest = $env:CANDIDATE_ARTIFACT_DIGEST
            installer_sha256 = $hash
            authenticode_status = [string]$signature.Status
            signer_subject = [string]$signature.SignerCertificate.Subject
            ui_completion = "not_observed"
            install_root_claim = "not_made"
          }
          $result | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath 'evidence/result.json'
          'HERMES_WINDOWS_INSTALLER_STATIC_CONTRACT_PASSED' | Set-Content -LiteralPath 'evidence/result.txt'
      - name: Optionally observe a visible installer launch
        if: ${{ inputs.launch_visible_installer }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'payload/Hermes-Setup.exe').Path
          $selectedHome = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "hermes-launch-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"))
          New-Item -ItemType Directory -Path $selectedHome -Force | Out-Null

          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $installer
          $startInfo.WorkingDirectory = Split-Path -Parent $installer
          $startInfo.UseShellExecute = $false
          $startInfo.Environment['HERMES_HOME'] = $selectedHome
          $process = [Diagnostics.Process]::Start($startInfo)
          if ($null -eq $process) { throw 'INSTALLER_VISIBLE_LAUNCH_FAILED' }
          Start-Sleep -Seconds 10
          $process.Refresh()
          $launchState = if ($process.HasExited) { "exited:$($process.ExitCode)" } else { 'running' }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
          }

          [ordered]@{
            schema_version = 1
            observation = 'visible_process_launch_only'
            process_state_after_10_seconds = $launchState
            ui_completion = "not_observed"
            install_root_claim = "not_made"
          } | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath 'evidence/visible-launch.json'
          'HERMES_WINDOWS_INSTALLER_VISIBLE_LAUNCH_OBSERVED' | Set-Content -LiteralPath 'evidence/visible-launch.txt'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: hermes-windows-installer-contract-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
