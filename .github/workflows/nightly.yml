name: nightly-platforms

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful ci workflow run containing candidate-binaries; empty selects the latest successful run for this ref
        required: false
        type: string
      candidate_digest:
        description: Expected sha256 artifact digest; required for release evidence, optional for scheduled discovery
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ci-run-id: ${{ steps.resolve.outputs.ci-run-id }}
      candidate-digest: ${{ steps.resolve.outputs.candidate-digest }}
    steps:
      - id: resolve
        name: Resolve successful CI candidate by artifact digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          REQUESTED_CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          set -euo pipefail
          ci_run_id="$REQUESTED_CI_RUN_ID"
          if [[ -z "$ci_run_id" ]]; then
            ci_run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$ci_run_id" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" --jq '.path')" = ".github/workflows/ci.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" --jq '.head_sha')" = "$GITHUB_SHA"
          candidate_digest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/artifacts" --jq '.artifacts[] | select(.name == "candidate-binaries" and .expired == false) | .digest')
          [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ -n "$REQUESTED_CANDIDATE_DIGEST" ]]; then
            test "$candidate_digest" = "$REQUESTED_CANDIDATE_DIGEST"
          fi
          printf 'ci-run-id=%s\n' "$ci_run_id" >> "$GITHUB_OUTPUT"
          printf 'candidate-digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"

  macos-current:
    needs: resolve-candidate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-binaries
          path: dist
          run-id: ${{ needs.resolve-candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - name: Test source and exact candidate on current macOS
        shell: bash
        env:
          TEAMKIT_TEST_BINARY: dist/teamkit-v0.1.5-darwin-arm64
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.resolve-candidate.outputs.candidate-digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/evidence/macos-current
          (cd dist && shasum -a 256 --check SHA256SUMS)
          chmod +x "$TEAMKIT_TEST_BINARY"
          go vet ./...
          go test -json ./... | tee dist/evidence/macos-current/tests.json
          go test -race ./...
          "$TEAMKIT_TEST_BINARY" --version | tee dist/evidence/macos-current/version.json
          printf 'candidate_digest=%s\n' "$CANDIDATE_ARTIFACT_DIGEST" > dist/evidence/macos-current/candidate.txt
          go run ./cmd/teamkit-security-audit \
            --repository . --path dist --commit "$GITHUB_SHA" \
            --output dist/evidence/macos-current/security-audit-macos-current.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: macos-current-evidence
          path: dist/evidence/macos-current/
          if-no-files-found: error
          retention-days: 14

  alt-p11-qemu:
    needs: resolve-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-binaries
          path: dist
          run-id: ${{ needs.resolve-candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded candidate contents
        shell: bash
        run: (cd dist && sha256sum --check --strict SHA256SUMS)
      - name: Install QEMU test prerequisites
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client gnupg
      - name: Boot official ALT p11 image under QEMU TCG
        env:
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.resolve-candidate.outputs.candidate-digest }}
        run: |
          set -euo pipefail
          bash scripts/alt-qemu-smoke.sh dist/teamkit-v0.1.5-linux-amd64
          grep -F 'ALT_VM_VERIFIED' dist/evidence/alt-qemu/result.txt
          grep -F "candidate_digest=$CANDIDATE_ARTIFACT_DIGEST" dist/evidence/alt-qemu/result.txt
          go run ./cmd/teamkit-security-audit \
            --repository . --path dist --commit "$GITHUB_SHA" \
            --output dist/evidence/alt-qemu/security-audit-alt-qemu.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: alt-qemu-evidence
          path: dist/evidence/alt-qemu/
          if-no-files-found: error
          retention-days: 14
