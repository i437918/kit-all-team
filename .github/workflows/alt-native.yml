name: optional-alt-native

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful ci run containing the exact candidate-binaries artifact
        required: true
        type: string
      candidate_digest:
        description: Exact sha256 digest reported for candidate-binaries
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  VERSION: v0.1.5

jobs:
  gate-candidate:
    if: ${{ vars.ENABLE_ALT_NATIVE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate exact candidate on successful same-commit CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.path')" = ".github/workflows/ci.yml"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '.head_sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "candidate-binaries" and .expired == false)] | length')" = "1"
          actual_digest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "candidate-binaries" and .expired == false) | .digest')
          test "$actual_digest" = "$CANDIDATE_ARTIFACT_DIGEST"

  alt-native:
    if: ${{ vars.ENABLE_ALT_NATIVE == 'true' }}
    needs: gate-candidate
    runs-on: [self-hosted, linux, x64, alt-p11]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Download exact CI candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-binaries
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Run exact candidate lifecycle on native ALT p11
        shell: bash
        env:
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_digest }}
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = altlinux
          (cd dist && sha256sum --check --strict SHA256SUMS)
          candidate="dist/teamkit-$VERSION-linux-amd64"
          test -f "$candidate"
          chmod 700 "$candidate"
          mkdir -p evidence/alt-native
          bash scripts/artifact-lifecycle-smoke.sh "$candidate" evidence/alt-native/lifecycle
          grep -Fx 'ARTIFACT_LIFECYCLE_VERIFIED' evidence/alt-native/lifecycle/result.txt
          printf 'candidate_digest=%s\n' "$CANDIDATE_ARTIFACT_DIGEST" > evidence/alt-native/candidate.txt
          printf 'ALT_NATIVE_RUNNER_VERIFIED\n' > evidence/alt-native/result.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: alt-native-evidence
          path: evidence/alt-native/
          if-no-files-found: warn
          retention-days: 14
